font_size 12.0
cursor_trail 1

macos_titlebar_color #000000
macos_option_as_alt yes
macos_quit_when_last_window_closed yes

clear_all_shortcuts yes

map --allow-fallback=shifted,ascii cmd+c copy_or_noop
map --allow-fallback=shifted,ascii cmd+v paste_from_clipboard

map alt+backspace send_text all \x17
map super+backspace send_text all \x15

map super+minus change_font_size all -1.0
map super+equal change_font_size all +1.0
map super+0 change_font_size all 0

map --allow-fallback=shifted,ascii super+shift+e open_url_with_hints

map cmd+q quit

# this accompanies the kitty font for the nerd variant
# font_family      family="MesloLGS Nerd Font Mono"
modify_font cell_height 92%
modify_font baseline 0.5

# BEGIN_KITTY_FONTS
font_family      family="MesloLGS Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

startup_session herdr.session
